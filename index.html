<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOEX — Доска опционов</title>
  <style>
    :root {
      --bg:      #0b0b14;
      --surface: #121220;
      --card:    #191928;
      --border:  #232338;
      --text:    #cdd0e0;
      --muted:   #52526e;
      --accent:  #5b9cf6;
      --call:    #3ec79e;
      --put:     #e05555;
      --call-bg: rgba(62,199,158,.07);
      --put-bg:  rgba(224,85,85,.07);
      --atm:     rgba(91,156,246,.4);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: 'Consolas','Courier New',monospace; font-size: 12px; }
    body { display: flex; flex-direction: column; }

    /* ── HEADER ── */
    .hdr {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 8px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; flex-shrink: 0;
    }
    .logo { color: var(--accent); font-size: 14px; font-weight: 700; letter-spacing: 3px; white-space: nowrap; }
    .logo small { color: var(--muted); font-weight: 400; letter-spacing: 0; font-size: 11px; }

    .ctrl-lbl { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .8px; }

    select, button, input {
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      padding: 5px 9px; border-radius: 3px; font-family: inherit; font-size: 12px; cursor: pointer;
    }
    select:focus, button:focus, input:focus { outline: none; border-color: var(--accent); }
    button:hover { background: var(--border); }
    button:disabled { opacity: .4; cursor: default; }

    /* ── TABS ── */
    .tabs { display: flex; gap: 3px; }
    .tab {
      padding: 4px 13px; border-radius: 3px; font-size: 12px; cursor: pointer;
      border: 1px solid var(--border); background: transparent; color: var(--muted);
      transition: color .15s, border-color .15s, background .15s;
    }
    .tab.active { color: var(--accent); border-color: var(--accent); background: rgba(91,156,246,.1); }
    .tab .cnt {
      display: inline-block; background: var(--accent); color: var(--bg);
      font-size: 9px; font-weight: 700; padding: 1px 4px; border-radius: 8px;
      margin-left: 5px; vertical-align: middle; min-width: 15px; text-align: center;
    }
    .tab .cnt:empty { display: none; }

    .presets { display: flex; gap: 4px; flex-wrap: wrap; }
    .pbtn {
      padding: 4px 10px; border-radius: 3px; font-size: 11px;
      border: 1px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .pbtn:hover, .pbtn.active { color: var(--accent); border-color: var(--accent); }

    .rows-ctrl { display: flex; align-items: center; gap: 4px; }
    .rows-ctrl button { padding: 3px 8px; font-size: 13px; }
    .rows-val { min-width: 28px; text-align: center; color: var(--accent); }

    .status-bar { margin-left: auto; display: flex; align-items: center; gap: 7px;
      color: var(--muted); font-size: 11px; white-space: nowrap; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .dot.ok   { background: #4ade80; animation: blink 3s infinite; }
    .dot.err  { background: var(--put); }
    .dot.spin { background: var(--accent); animation: blink .7s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

    /* ── CONTENT ── */
    .content { flex: 1; overflow: auto; position: relative; }
    .state { position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; }
    .spinner { width: 34px; height: 34px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-txt { color: var(--muted); }
    .state-err { color: var(--put); }

    /* ── BOARD TABLE ── */
    table { width: 100%; border-collapse: collapse; min-width: 920px; }
    thead { position: sticky; top: 0; z-index: 5; }
    .gh th { padding: 5px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
    .gh .ch { background: rgba(62,199,158,.18); color: var(--call); }
    .gh .ph { background: rgba(224,85,85,.18);  color: var(--put); }
    .gh .sh { background: var(--card); color: var(--accent); }
    .colh th { padding: 3px 8px; font-size: 10px; font-weight: 400;
      text-transform: uppercase; letter-spacing: .4px;
      border-bottom: 1px solid var(--border); text-align: right; }
    .colh .cc { background: rgba(62,199,158,.09); color: var(--call); }
    .colh .pc { background: rgba(224,85,85,.09);  color: var(--put); }
    .colh .sc { background: var(--card); color: var(--accent); text-align: center; }
    .colh .ac { background: rgba(62,199,158,.05); text-align: center; }
    .colh .ap { background: rgba(224,85,85,.05);  text-align: center; }
    tbody tr { border-bottom: 1px solid rgba(255,255,255,.02); }
    tbody tr:hover td { filter: brightness(1.6); }
    td { padding: 3px 8px; text-align: right; white-space: nowrap; }
    td.cc { background: var(--call-bg); }
    td.pc { background: var(--put-bg); }
    td.sc {
      background: var(--card); color: var(--accent); font-weight: 700; text-align: center;
      border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    }
    td.act { background: rgba(0,0,0,.15); padding: 2px 4px; text-align: center; }
    tr.atm td   { border-top: 1px solid var(--atm) !important; border-bottom: 1px solid var(--atm) !important; }
    tr.atm td.sc { background: rgba(91,156,246,.15); }

    /* action buttons inside table */
    .ab {
      border: none; cursor: pointer; border-radius: 2px;
      font-size: 10px; font-weight: 700; padding: 2px 5px; line-height: 1.4;
      font-family: inherit;
    }
    .ab.buy { background: rgba(62,199,158,.2); color: var(--call); }
    .ab.buy:hover { background: rgba(62,199,158,.4); }
    .ab.sel { background: rgba(224,85,85,.2); color: var(--put); }
    .ab.sel:hover { background: rgba(224,85,85,.4); }

    .vb  { color: #4ade80; }
    .va  { color: #f87171; }
    .viv { color: #fb923c; }
    .vth { color: #94a3b8; }
    .vd  { color: #c084fc; }
    .vl  { color: #60a5fa; }
    .v0  { color: var(--border); }

    /* ── AUTOCOMPLETE ── */
    .ac-wrap { position: relative; }
    .ac-input {
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      padding: 5px 28px 5px 9px; border-radius: 3px; font-family: inherit; font-size: 12px;
      width: 180px; outline: none;
    }
    .ac-input:focus { border-color: var(--accent); }
    .ac-clear {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      color: var(--muted); cursor: pointer; font-size: 13px; line-height: 1;
      display: none; background: none; border: none; padding: 0;
    }
    .ac-input:not(:placeholder-shown) ~ .ac-clear { display: block; }
    .ac-drop {
      position: absolute; top: calc(100% + 3px); left: 0; z-index: 200;
      background: var(--card); border: 1px solid var(--border); border-radius: 3px;
      min-width: 280px; max-height: 240px; overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,.5); display: none;
    }
    .ac-drop.open { display: block; }
    .ac-item { padding: 6px 10px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
    .ac-item:hover, .ac-item.sel { background: var(--border); }
    .ac-item .ac-code { color: var(--accent); font-weight: 700; min-width: 50px; }
    .ac-item .ac-title { color: var(--muted); font-size: 11px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; }
    .ac-empty { padding: 8px 10px; color: var(--muted); font-size: 11px; }

    /* ── BADGES ── */
    .badge { display: inline-block; padding: 1px 5px; border-radius: 2px; font-size: 10px; margin-left: 4px; vertical-align: middle; }
    .badge-W { background: rgba(251,146,60,.2);  color: #fb923c; }
    .badge-M { background: rgba(91,156,246,.2);  color: var(--accent); }
    .badge-Q { background: rgba(62,199,158,.2);  color: var(--call); }
    .badge-C { background: rgba(62,199,158,.2);  color: var(--call); }
    .badge-P { background: rgba(224,85,85,.2);   color: var(--put); }
    .badge-B { background: rgba(62,199,158,.15); color: var(--call); }
    .badge-S { background: rgba(224,85,85,.15);  color: var(--put); }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(2px);
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
      padding: 24px; min-width: 320px; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,.6);
    }
    .modal-title { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
    .modal-sub { color: var(--muted); font-size: 11px; margin-bottom: 20px; }
    .modal-field { margin-bottom: 14px; }
    .modal-field label { display: block; color: var(--muted); font-size: 10px;
      text-transform: uppercase; letter-spacing: .7px; margin-bottom: 5px; }
    .modal-field input[type=number] {
      width: 100%; padding: 7px 10px; font-size: 14px; background: var(--card);
      border: 1px solid var(--border); border-radius: 3px; color: var(--text); font-family: inherit;
    }
    .modal-field input[type=number]:focus { outline: none; border-color: var(--accent); }
    .modal-btns { display: flex; gap: 8px; margin-top: 20px; }
    .modal-btns button { flex: 1; padding: 8px; font-size: 12px; }
    .btn-confirm-buy  { background: rgba(62,199,158,.2) !important; color: var(--call) !important;
      border-color: rgba(62,199,158,.4) !important; }
    .btn-confirm-buy:hover  { background: rgba(62,199,158,.35) !important; }
    .btn-confirm-sell { background: rgba(224,85,85,.2) !important; color: var(--put) !important;
      border-color: rgba(224,85,85,.4) !important; }
    .btn-confirm-sell:hover { background: rgba(224,85,85,.35) !important; }

    /* ── PORTFOLIO TABLE ── */
    .ptable-wrap { padding: 16px; }
    .ptable-wrap h2 { color: var(--muted); font-size: 11px; text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 12px; }
    .ptable { width: 100%; border-collapse: collapse; }
    .ptable th {
      padding: 5px 10px; font-size: 10px; font-weight: 400; text-transform: uppercase;
      letter-spacing: .5px; color: var(--muted); border-bottom: 1px solid var(--border);
      text-align: right; white-space: nowrap;
    }
    .ptable th:first-child { text-align: left; }
    .ptable td { padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,.03); text-align: right; }
    .ptable td:first-child { text-align: left; }
    .ptable tr:hover td { background: var(--card); }
    .pg-header td {
      background: var(--border); padding: 5px 10px;
      border-top: 2px solid var(--accent);
    }
    .pg-header:first-child td { border-top: none; }
    .pg-total td { border-top: 1px solid var(--border); padding: 4px 10px;
      text-align: right; color: var(--text); font-weight: 700; background: rgba(91,156,246,.05); }
    .pg-subtotal td { background: rgba(255,255,255,.02); border-top: 1px dashed var(--border); padding: 3px 10px; }
    .pg-asset { color: var(--accent); font-weight: 700; font-size: 13px; letter-spacing: 1px; }
    .pg-cnt { color: var(--muted); font-size: 10px; margin-left: 10px; }

    .del-btn {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 14px; padding: 0 4px; line-height: 1;
    }
    .del-btn:hover { color: var(--put); background: none; }
    .p-empty { padding: 48px; text-align: center; color: var(--muted); }

    /* ── FINAM CONNECT ── */
    .finam-bar {
      display: flex; align-items: center; gap: 10px; padding: 10px 16px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      font-size: 11px; flex-wrap: wrap;
    }
    .finam-status { color: var(--muted); }
    .finam-status.ok { color: var(--call); }
    .finam-connect {
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      gap: 14px; padding: 60px 20px; text-align: center;
    }
    .finam-connect p { color: var(--muted); max-width: 380px; line-height: 1.6; }
    .btn-primary {
      background: rgba(91,156,246,.2); color: var(--accent); border: 1px solid rgba(91,156,246,.4);
      padding: 8px 20px; border-radius: 3px; font-family: inherit; font-size: 12px; cursor: pointer;
    }
    .btn-primary:hover { background: rgba(91,156,246,.35); }
    .pnl-pos { color: var(--call); }
    .pnl-neg { color: var(--put); }

    /* ── FOOTER ── */
    .ftr { background: var(--surface); border-top: 1px solid var(--border);
      padding: 5px 16px; display: flex; gap: 16px; flex-wrap: wrap; flex-shrink: 0; }
    .leg { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--muted); }

    .board-only { /* shown only in board tab */ }
  </style>
</head>
<body>

<div class="hdr">
  <div class="logo">MOEX <small>/ Options</small></div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" id="tabBoard" onclick="switchTab('board')">Доска</button>
    <button class="tab" id="tabPortfolio" onclick="switchTab('portfolio')">Портфель<span class="cnt" id="portCnt"></span></button>
  </div>

  <!-- Board controls (hidden in portfolio tab) -->
  <div id="boardControls" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <div class="presets" id="presets">
      <span class="ctrl-lbl" style="align-self:center">Актив:</span>
    </div>

    <div class="ac-wrap" id="acWrap">
      <input id="acInput" class="ac-input" type="text" placeholder="Тикер…" autocomplete="off"
        oninput="acFilter()" onfocus="acOpen()" onkeydown="acKey(event)">
      <button class="ac-clear" onclick="acClear()" tabindex="-1">✕</button>
      <div id="acDrop" class="ac-drop"></div>
    </div>

    <div style="display:flex;align-items:center;gap:6px">
      <span class="ctrl-lbl">Серия:</span>
      <select id="selSeries" style="min-width:160px" disabled onchange="loadBoard()">
        <option>—</option>
      </select>
    </div>

    <div class="rows-ctrl">
      <span class="ctrl-lbl">Строк:</span>
      <button onclick="changeRows(-5)">−</button>
      <span class="rows-val" id="rowsVal">20</span>
      <button onclick="changeRows(+5)">+</button>
    </div>

    <button id="btnRefresh" disabled onclick="loadBoard()">↻</button>
  </div>

  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <span id="statusMsg">Загрузка активов…</span>
  </div>
</div>

<div class="content" id="content">
  <div class="state">
    <div class="spinner"></div>
    <div class="state-txt">Загрузка списка активов…</div>
  </div>
</div>

<div class="ftr" id="ftr">
  <div class="leg"><span class="vb">■</span> Bid</div>
  <div class="leg"><span class="va">■</span> Ask</div>
  <div class="leg"><span class="viv">■</span> IV%</div>
  <div class="leg"><span class="vd">■</span> Δ Delta</div>
  <div class="leg"><span class="vth">■</span> Теор. цена</div>
  <div class="leg"><span class="vl">■</span> Last</div>
  <div class="leg"><span style="color:var(--accent)">▬</span> ATM</div>
  <div class="leg"><span class="badge badge-W">W</span>Нед</div>
  <div class="leg"><span class="badge badge-M">M</span>Мес</div>
  <div class="leg"><span class="badge badge-Q">Q</span>Кварт</div>
</div>

<!-- Finam settings modal -->
<div class="modal-overlay hidden" id="finamModal" onclick="if(event.target===this)closeFinamModal()">
  <div class="modal-box">
    <div class="modal-title">Подключить Finam Trade</div>
    <div class="modal-sub">Данные хранятся только в браузере</div>
    <div class="modal-field">
      <label>API-токен</label>
      <input type="text" id="finamTokenInput" placeholder="tapi_sk_..." style="width:100%;padding:7px 10px;font-size:12px;background:var(--card);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:inherit" oninput="resetAccountsList()">
    </div>
    <div class="modal-field" style="font-size:10px;color:var(--muted);margin-top:-8px;margin-bottom:4px">
      api.finam.ru → Войти → Настройки → API → Создать токен
    </div>
    <div id="accountsField" class="modal-field" style="display:none">
      <label>Счёт</label>
      <select id="finamClientSelect" style="width:100%;padding:7px 10px;font-size:13px;background:var(--card);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:inherit"></select>
    </div>
    <div id="accountsMsg" style="font-size:11px;color:var(--muted);margin-bottom:10px;min-height:18px"></div>
    <div class="modal-btns">
      <button onclick="closeFinamModal()">Отмена</button>
      <button class="btn-primary" id="btnFetchAccounts" onclick="fetchAccounts()">Найти счета →</button>
      <button class="btn-primary" id="btnConnect" style="display:none" onclick="saveFinamSettings()">Подключить</button>
    </div>
  </div>
</div>


<script>
const BASE = '/iss/apps/option-calc/v1';

let rows = 20;
let currentAsset = null;
let currentSeries = null;
let allSeries = [];
let currentTab = 'board';
let currentDec = 0;
let currentLotMult = 1;

/* ── TABS ── */
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabBoard').classList.toggle('active', tab === 'board');
  document.getElementById('tabPortfolio').classList.toggle('active', tab === 'portfolio');
  document.getElementById('boardControls').style.display = tab === 'board' ? 'flex' : 'none';
  document.getElementById('ftr').style.display = tab === 'board' ? 'flex' : 'none';
  if (tab === 'board') {
    // restore board view
    if (currentAsset && currentSeries) loadBoard(); else
    setContent('<div class="state"><div class="state-txt">Выберите базовый актив</div></div>');
  } else {
    renderPortfolio();
  }
}

/* ── utils ── */
function setStatus(msg, state) {
  document.getElementById('statusMsg').textContent = msg;
  document.getElementById('dot').className = 'dot' + (state ? ' ' + state : '');
}
function setContent(html) {
  document.getElementById('content').innerHTML = html;
}
async function api(path) {
  const r = await fetch(BASE + path);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}
function fmtDate(s) {
  if (!s) return '—';
  const [y,m,d] = s.split('-');
  const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  return `${+d} ${months[+m-1]} ${y}`;
}
function fmtN(v, dec = 0) {
  const n = Number(v);
  if (v === null || v === undefined || isNaN(n) || n === 0) return '<span class="v0">—</span>';
  return n.toLocaleString('ru-RU', {minimumFractionDigits: dec, maximumFractionDigits: dec});
}
function fmtNraw(v, dec = 0) {
  const n = Number(v);
  if (!v || isNaN(n)) return '—';
  return n.toLocaleString('ru-RU', {minimumFractionDigits: dec, maximumFractionDigits: dec});
}
function fmtPct(v) {
  const n = Number(v);
  if (v === null || v === undefined || isNaN(n) || n === 0) return '<span class="v0">—</span>';
  return n.toFixed(1) + '%';
}
function fmtDelta(v) {
  const n = Number(v);
  if (v === null || v === undefined || isNaN(n)) return '<span class="v0">—</span>';
  return n.toFixed(2);
}

/* ── detect price precision ── */
function detectPrecision(board) {
  const all = [...(board.call || []), ...(board.put || [])];
  let maxDec = 0;
  for (const r of all) {
    for (const key of ['theorprice', 'bid', 'offer', 'last']) {
      const v = r[key];
      if (!v) continue;
      const s = String(Number(v));
      if (s.includes('.')) {
        const dec = s.split('.')[1].replace(/0+$/, '').length;
        if (dec > maxDec) maxDec = dec;
      }
    }
  }
  return maxDec; // 0, 1, 2, or 3
}

/* ── detect lot multiplier (e.g. 1000 for CNY) via theorprice_rub/theorprice ── */
function detectLotMultiplier(board) {
  const all = [...(board.call || []), ...(board.put || [])];
  for (const r of all) {
    if (r.theorprice > 0 && r.theorprice_rub > 0) {
      const mult = Math.round(r.theorprice_rub / r.theorprice);
      if (mult > 1) return mult;
    }
  }
  return 1;
}

/* ── rows control ── */
function changeRows(d) {
  rows = Math.max(5, Math.min(50, rows + d));
  document.getElementById('rowsVal').textContent = rows;
  if (currentAsset && currentSeries) loadBoard();
}

/* ── 1. load assets + autocomplete ── */
const PRESETS = ['Si', 'Ri', 'Eu', 'GAZP', 'SBER', 'LKOH'];
let allAssets = [];
let acIdx = -1;

async function init() {
  updatePortCnt();
  try {
    allAssets = await api('/assets');

    const container = document.getElementById('presets');
    PRESETS.forEach(code => {
      if (allAssets.find(a => a.asset_code === code)) {
        const btn = document.createElement('button');
        btn.className = 'pbtn';
        btn.textContent = code;
        btn.onclick = () => acSelect(code);
        container.appendChild(btn);
      }
    });

    setStatus('Выберите актив', '');
    setContent('<div class="state"><div class="state-txt">Выберите базовый актив</div></div>');

    e.preventDefault(); acIdx = Math.min(acIdx + 1, items.length - 1);

/* ── FINAM API ── */
async function getFinamJwt(secret) {
  const r = await fetch('https://api.finam.ru/v1/sessions', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({secret})
  });
  if (!r.ok) throw new Error(`Авторизация: HTTP ${r.status}`);
  const d = await r.json();
  const jwt = d.token || d.data?.token;
  if (!jwt) throw new Error('JWT не получен');
  return jwt;
}

async function fetchFinamPositions(secret, accountId) {
  const jwt = await getFinamJwt(secret);
  const r = await fetch(`https://api.finam.ru/v1/accounts/${encodeURIComponent(accountId)}`, {
    headers: {'Authorization': `Bearer ${jwt}`}
  });
  if (!r.ok) throw new Error(`Портфель: HTTP ${r.status}`);
  const data = await r.json();
  return data.positions || data.data?.positions || [];
}

function fmtF(v, dec = 2) {
  if (v === null || v === undefined || v === '' || isNaN(Number(v))) return '<span class="v0">—</span>';
  return Number(v).toLocaleString('ru-RU', {minimumFractionDigits: dec, maximumFractionDigits: dec});
}

/* ── Black-76 Greeks ── */
function _normCDF(x) {
  const t = 1 / (1 + 0.2315419 * Math.abs(x));
  const d = Math.exp(-x * x / 2) / Math.sqrt(2 * Math.PI);
  const p = d * t * (0.319381530 + t * (-0.356563782 + t * (1.781477937 + t * (-1.821255978 + t * 1.330274429))));
  return x >= 0 ? 1 - p : p;
}
function _normPDF(x) { return Math.exp(-x * x / 2) / Math.sqrt(2 * Math.PI); }

function _impliedVol(price, F, K, T, type) {
  if (price <= 0 || T <= 0 || F <= 0 || K <= 0) return null;
  let lo = 1e-4, hi = 20;
  for (let i = 0; i < 200; i++) {
    const mid = (lo + hi) / 2, sq = Math.sqrt(T);
    const d1  = (Math.log(F / K) + 0.5 * mid * mid * T) / (mid * sq);
    const d2  = d1 - mid * sq;
    const p   = type === 'C'
      ? F * _normCDF(d1)  - K * _normCDF(d2)
      : K * _normCDF(-d2) - F * _normCDF(-d1);
    if (p < price) lo = mid; else hi = mid;
    if (hi - lo < 1e-7) break;
  }
  return (lo + hi) / 2;
}

function _black76(F, K, T, iv, type) {
  if (T <= 0 || iv <= 0 || F <= 0 || K <= 0) return null;
  const sq = Math.sqrt(T);
  const d1 = (Math.log(F / K) + 0.5 * iv * iv * T) / (iv * sq);
  const d2 = d1 - iv * sq;
  return {
    delta: type === 'C' ? _normCDF(d1) : _normCDF(d1) - 1,
    vega:  F * _normPDF(d1) * sq / 100,          // руб. на 1% IV
    theta: -(F * _normPDF(d1) * iv / (2 * sq)) / 365,  // руб./день
  };
}

/* ── GREEKS fetch (1 запрос на символ, считаем Black-76 локально) ── */
const _greeksCache = {};
async function fetchOptionGreeks(symbol) {
  const base = symbol.replace(/@.*$/, '');
  if (_greeksCache[base] !== undefined) return _greeksCache[base];
  try {
    const url = `/iss/engines/futures/markets/options/boards/ROPD/securities/${encodeURIComponent(base)}.json` +
      `?iss.meta=off&securities.columns=SECID,OPTIONTYPE,STRIKE,LASTTRADEDATE,UNDERLYINGSETTLEPRICE,SETTLEPRICE_CLR` +
      `&marketdata.columns=SECID,LAST,SETTLEPRICE`;
    const r = await fetch(url);
    if (!r.ok) { _greeksCache[base] = null; return null; }
    const d = await r.json();
    const sc = d.securities?.columns || [], sd = d.securities?.data?.[0];
    const mc = d.marketdata?.columns || [], md = d.marketdata?.data?.[0];
    if (!sd) { _greeksCache[base] = null; return null; }
    const sg = k => { const i = sc.indexOf(k); return i >= 0 ? sd[i] : null; };
    const mg = k => { const i = mc.indexOf(k); return i >= 0 ? (md?.[i] ?? null) : null; };

    const type     = sg('OPTIONTYPE');
    const K        = Number(sg('STRIKE'));
    const F        = Number(sg('UNDERLYINGSETTLEPRICE'));
    const expStr   = sg('LASTTRADEDATE');
    const optPrice = mg('LAST') || mg('SETTLEPRICE') || Number(sg('SETTLEPRICE_CLR'));
    if (!type || !K || !F || !expStr || !optPrice) { _greeksCache[base] = null; return null; }

    const T  = (new Date(expStr) - Date.now()) / (1000 * 86400 * 365);
    const iv = _impliedVol(optPrice, F, K, T, type);
    if (!iv) { _greeksCache[base] = null; return null; }

    const g = _black76(F, K, T, iv, type);
    // store F, K, type so caller can compute intrinsic/time value
    g.F = F; g.K = K; g.type = type;
    _greeksCache[base] = g;
    return g;
  } catch { _greeksCache[base] = null; return null; }
}

/* ── PORTFOLIO view ── */
async function renderPortfolio() {
  const { token, clientId } = getFinamCreds();

  if (!token || !clientId) {
    setContent(`<div class="finam-connect">
      <div style="font-size:28px">📊</div>
      <p>Подключите Finam Trade, чтобы автоматически видеть свои опционные позиции.</p>
      <button class="btn-primary" onclick="openFinamModal()">Подключить Finam</button>
    </div>`);
    updatePortCnt(0);
    return;
  }

  setContent('<div class="state"><div class="spinner"></div><div class="state-txt">Загрузка портфеля из Finam…</div></div>');

  let positions;
  try {
    positions = await fetchFinamPositions(token, clientId);
  } catch(e) {
    setContent(`<div class="state">
      <div class="state-err">Ошибка Finam API: ${e.message}</div>
      <button class="btn-primary" style="margin-top:12px" onclick="openFinamModal()">Изменить настройки</button>
    </div>`);
    return;
  }

  // Filter: non-zero quantity only
  const opts = positions.filter(p => {
    const qty = Number(p.quantity?.value ?? p.balance ?? 0);
    return qty !== 0;
  });

  updatePortCnt(opts.length);

  if (!opts.length) {
    setContent(`<div class="finam-connect">
      <p style="color:var(--muted)">Открытых позиций нет (подключено: ${clientId})</p>
      <button onclick="renderPortfolio()" style="margin-top:8px">↻ Обновить</button>
      <button onclick="disconnectFinam()" style="margin-top:4px;color:var(--muted)">Отключить</button>
    </div>`);
    return;
  }

  // Group by underlying (parse from symbol, e.g. "SBRM5C25000@FORTS" → "SBR")
  function getUnderlying(p) {
    const sym = (p.symbol || p.securityCode || p.SecurityCode || '').replace(/@.*$/, '');
    const m = sym.match(/^([A-Za-z]{2,4})/);
    return m ? m[1] : sym.slice(0, 4);
  }

  // CR options/futures: API price is in rubles per 1 CNY; 1 contract = 1000 CNY,
  // so multiply price by 1000 to get rubles per contract (same unit as all other instruments)
  function crLotMult(symbol) {
    return /^CR/i.test(symbol.replace(/@.*$/, '')) ? 1000 : 1;
  }

  // Fetch greeks for all positions in parallel
  const greeksMap = {};
  await Promise.all(opts.map(async p => {
    const sym = p.symbol || p.securityCode || '';
    const g = await fetchOptionGreeks(sym);
    if (g) greeksMap[sym] = g;
  }));

  const groups = {};
  opts.forEach(p => {
    const key = getUnderlying(p);
    (groups[key] = groups[key] || []).push(p);
  });

  const COLS = 13;
  let rows = '';
  let grandPnl   = 0;
  let grandTotal = 0;
  let grandDelta = 0;

  Object.entries(groups).forEach(([underlying, positions]) => {
    const groupPnl   = positions.reduce((s, p) => s + Number(p.unrealized_pnl?.value ?? p.unrealizedPnl ?? 0), 0);
    grandPnl += groupPnl;
    const pnlCls = groupPnl >= 0 ? 'pnl-pos' : 'pnl-neg';

    rows += `<tr class="pg-header">
      <td colspan="${COLS}">
        <span class="pg-asset">${underlying}</span>
        <span class="pg-cnt">${positions.length} поз.</span>
        <span class="${pnlCls}" style="margin-left:auto;float:right;font-size:11px">P&amp;L: ${Number(groupPnl).toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>
      </td>
    </tr>`;

    let groupTotal = 0;
    let groupDelta = 0;
    const fmtG = (v, d=2) => v != null && isFinite(v) ? v.toFixed(d) : '<span class="v0">—</span>';

    positions.forEach(p => {
      const sym      = p.symbol || p.securityCode || '—';
      const mult     = crLotMult(sym);
      const qty      = Number(p.quantity?.value   ?? p.balance ?? 0);
      const curPrice = Number(p.current_price?.value ?? p.currentPrice ?? 0) * mult;
      const avgPrice = Number(p.average_price?.value ?? p.averagePrice ?? 0) * mult;
      const pnl      = Number(p.unrealized_pnl?.value ?? p.unrealizedPnl ?? 0);
      const total    = Math.abs(qty) * curPrice;
      groupTotal += total;

      const g        = greeksMap[sym] || {};
      const posDelta = g.delta != null ? g.delta * qty : null;
      const posTheta = g.theta != null ? g.theta * qty : null;
      const posVega  = g.vega  != null ? g.vega  * qty : null;
      if (posDelta != null) groupDelta += posDelta;

      // intrinsic value (per contract) and time value
      let intrinsic = null, timeVal = null;
      if (g.F != null && g.K != null && g.type && curPrice > 0) {
        intrinsic = g.type === 'C' ? Math.max(0, g.F - g.K) : Math.max(0, g.K - g.F);
        timeVal   = Math.max(0, curPrice - intrinsic);
      }

      const dirLabel = qty > 0 ? 'Куплено' : 'Продано';
      const dirCls   = qty > 0 ? 'vb' : 'va';
      const pnlCls   = pnl >= 0 ? 'pnl-pos' : 'pnl-neg';
      const ticker   = sym.replace(/@.*$/, '');

      rows += `<tr>
        <td>${ticker}</td>
        <td><span class="${dirCls}">${dirLabel}</span></td>
        <td>${Math.abs(qty)}</td>
        <td>${avgPrice ? fmtF(avgPrice) : '<span class="v0">—</span>'}</td>
        <td style="color:var(--accent)">${fmtF(curPrice)}</td>
        <td>${fmtF(total)}</td>
        <td class="${pnlCls}">${fmtF(pnl)}</td>
        <td style="font-size:11px">${fmtG(posDelta)}</td>
        <td style="font-size:11px;color:var(--muted)">${fmtG(posTheta, 1)}</td>
        <td style="font-size:11px;color:var(--muted)">${fmtG(posVega, 1)}</td>
        <td style="font-size:11px;color:#4a9eff" title="Внутренняя стоимость = макс(0, F−K) или макс(0, K−F)">${intrinsic != null ? fmtF(intrinsic) : '<span class="v0">—</span>'}</td>
        <td style="font-size:11px;color:#f0a830" title="Временная стоимость = цена − внутренняя">${timeVal != null ? fmtF(timeVal) : '<span class="v0">—</span>'}</td>
        <td style="color:var(--muted);font-size:10px;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${sym}</td>
      </tr>`;
    });

    grandTotal += groupTotal;
    grandDelta += groupDelta;
    const deltaStr = groupDelta !== 0 ? ` &nbsp;Δ: <b>${groupDelta.toFixed(2)}</b>` : '';
    rows += `<tr class="pg-subtotal">
      <td colspan="5" style="text-align:right;color:var(--muted);font-size:10px">Итого по группе:</td>
      <td style="font-weight:600">${fmtF(groupTotal)}</td>
      <td class="${pnlCls}" style="font-weight:600">${fmtF(groupPnl)}</td>
      <td style="font-weight:600;font-size:11px">${groupDelta !== 0 ? groupDelta.toFixed(2) : ''}</td>
      <td colspan="5"></td>
    </tr>`;
  });

  const grandCls = grandPnl >= 0 ? 'pnl-pos' : 'pnl-neg';

  setContent(`
    <div class="finam-bar">
      <span class="finam-status ok">● Finam: ${clientId}</span>
      <button onclick="renderPortfolio()">↻ Обновить</button>
      <button onclick="openFinamModal()">Настройки</button>
      <button onclick="disconnectFinam()" style="color:var(--muted)">Отключить</button>
      <span style="margin-left:auto;font-size:11px;display:flex;gap:16px">
        <span>Сумма: <b>${fmtF(grandTotal)}</b></span>
        <span>P&amp;L: <span class="${grandCls}" style="font-weight:700">${fmtF(grandPnl)}</span></span>
        <span>Δ портфеля: <b>${grandDelta.toFixed(2)}</b></span>
      </span>
    </div>
    <div class="ptable-wrap">
      <table class="ptable">
        <thead>
          <tr>
            <th style="text-align:left">Тикер</th>
            <th>Позиция</th>
            <th>Кол-во</th>
            <th>Ср. цена</th>
            <th>Тек. цена</th>
            <th>Сумма</th>
            <th>P&amp;L</th>
            <th title="Позиционная дельта = Δ × qty">Δ</th>
            <th title="Позиционная тета = Θ × qty (руб/день)">Θ</th>
            <th title="Позиционная вега = ν × qty (руб/1% IV)">ν</th>
            <th title="Внутренняя стоимость = макс(0, F−K)">Внутр.</th>
            <th title="Временная стоимость = цена − внутренняя">Врем.</th>
            <th style="text-align:left">Тикер полный</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`);
}

function updatePortCnt(n) {
  const cnt = document.getElementById('portCnt');
  if (n === undefined) {
    const { token } = getFinamCreds();
    cnt.textContent = token ? '…' : '';
  } else {
    cnt.textContent = n || '';
  }
}

init();
</script>
</body>
</html>
