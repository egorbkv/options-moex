<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOEX — Доска опционов</title>
  <style>
    :root {
      --bg:       #0b0b14;
      --surface:  #121220;
      --card:     #191928;
      --border:   #232338;
      --text:     #cdd0e0;
      --muted:    #52526e;
      --accent:   #5b9cf6;
      --call:     #3ec79e;
      --put:      #e05555;
      --call-bg:  rgba(62,199,158,.07);
      --put-bg:   rgba(224,85,85,.07);
      --atm:      rgba(91,156,246,.35);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12px;
    }

    body { display: flex; flex-direction: column; }

    .hdr {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 9px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .logo {
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 3px;
      white-space: nowrap;
    }
    .logo small { color: var(--muted); font-weight: 400; letter-spacing: 0; font-size: 11px; }

    .presets { display: flex; gap: 5px; flex-wrap: wrap; }

    .preset-btn {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 3px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .preset-btn:hover,
    .preset-btn.active {
      color: var(--accent);
      border-color: var(--accent);
    }

    .search-group {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .ctrl-lbl {
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .8px;
    }

    input[type=text] {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 5px 9px;
      border-radius: 3px;
      font-family: inherit;
      font-size: 12px;
      width: 80px;
      text-transform: uppercase;
    }
    input[type=text]::placeholder { color: var(--muted); text-transform: none; }
    input[type=text]:focus { outline: none; border-color: var(--accent); }

    select, button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 5px 9px;
      border-radius: 3px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    select:focus, button:focus { outline: none; border-color: var(--accent); }
    button:hover { background: var(--border); }
    button:disabled { opacity: .4; cursor: default; }

    .expiry-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-bar {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .dot.ok   { background: #4ade80; animation: blink 3s infinite; }
    .dot.err  { background: var(--put); }
    .dot.spin { background: var(--accent); animation: blink .7s infinite; }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

    .content { flex: 1; overflow: auto; position: relative; }

    .state {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px;
    }

    .spinner {
      width: 34px; height: 34px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .state-txt { color: var(--muted); }
    .state-err { color: var(--put); }

    table { width: 100%; border-collapse: collapse; min-width: 860px; }
    thead { position: sticky; top: 0; z-index: 5; }

    .gh th { padding: 5px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
    .gh .ch { background: rgba(62,199,158,.18); color: var(--call); }
    .gh .ph { background: rgba(224,85,85,.18);  color: var(--put); }
    .gh .sh { background: var(--card); color: var(--accent); }

    .colh th {
      padding: 4px 8px;
      font-size: 10px; font-weight: 400;
      text-transform: uppercase; letter-spacing: .5px;
      border-bottom: 1px solid var(--border);
      text-align: right;
    }
    .colh .cc { background: rgba(62,199,158,.09); color: var(--call); }
    .colh .pc { background: rgba(224,85,85,.09);  color: var(--put); }
    .colh .sc { background: var(--card); color: var(--accent); text-align: center; }

    tbody tr { border-bottom: 1px solid rgba(255,255,255,.02); }
    tbody tr:hover td { filter: brightness(1.7); }

    td { padding: 3px 8px; text-align: right; white-space: nowrap; }
    td.cc { background: var(--call-bg); }
    td.pc { background: var(--put-bg); }
    td.sc {
      background: var(--card); color: var(--accent); font-weight: 700;
      text-align: center;
      border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    }

    tr.atm td   { border-top: 1px solid var(--atm) !important; border-bottom: 1px solid var(--atm) !important; }
    tr.atm td.sc { background: rgba(91,156,246,.12); }

    .vb  { color: #4ade80; }
    .va  { color: #f87171; }
    .viv { color: #fb923c; }
    .vth { color: #94a3b8; }
    .voi { color: var(--muted); }
    .v0  { color: var(--border); }

    .ftr {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 5px 18px;
      display: flex; gap: 18px; flex-wrap: wrap;
      flex-shrink: 0;
    }
    .leg { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--muted); }
  </style>
</head>
<body>

<div class="hdr">
  <div class="logo">MOEX <small>/ Options Chain</small></div>

  <!-- быстрые кнопки -->
  <div class="presets" id="presets">
    <span class="ctrl-lbl" style="align-self:center">Актив:</span>
    <button class="preset-btn" onclick="selectAsset('Si')">Si</button>
    <button class="preset-btn" onclick="selectAsset('Ri')">Ri</button>
    <button class="preset-btn" onclick="selectAsset('Eu')">Eu</button>
    <button class="preset-btn" onclick="selectAsset('GAZP')">GAZP</button>
    <button class="preset-btn" onclick="selectAsset('SBER')">SBER</button>
    <button class="preset-btn" onclick="selectAsset('LKOH')">LKOH</button>
  </div>

  <!-- ввод своего кода -->
  <div class="search-group">
    <input type="text" id="assetInput" placeholder="свой код…" maxlength="10"
      onkeydown="if(event.key==='Enter') selectAsset(this.value.trim().toUpperCase())">
    <button onclick="selectAsset(document.getElementById('assetInput').value.trim().toUpperCase())">→</button>
  </div>

  <!-- экспирация -->
  <div class="expiry-group">
    <span class="ctrl-lbl">Экспирация:</span>
    <select id="selExpiry" onchange="onExpiryChange()" disabled>
      <option>—</option>
    </select>
    <button id="btnRefresh" onclick="reloadCurrent()" disabled title="Обновить котировки">↻</button>
  </div>

  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <span id="statusMsg">Выберите актив</span>
  </div>
</div>

<div class="content" id="content">
  <div class="state">
    <div class="state-txt">Выберите базовый актив</div>
  </div>
</div>

<div class="ftr">
  <div class="leg"><span class="vb">■</span> Bid — лучший покупатель</div>
  <div class="leg"><span class="va">■</span> Ask — лучший продавец</div>
  <div class="leg"><span class="viv">■</span> IV% — подразум. волатильность</div>
  <div class="leg"><span class="vth">■</span> Теор. — теоретическая цена</div>
  <div class="leg"><span class="voi">■</span> OI — открытые позиции</div>
  <div class="leg"><span style="color:var(--accent)">▬</span> ATM — страйк ближе всего к деньгам</div>
</div>

<script>
const API = '/iss/engines/futures/markets/options/boards/ROPD/securities.json';

let currentAsset = null;
// cache: "ASSET|EXPIRY" -> options array
const cache = {};

/* ─── utils ─── */

function setStatus(msg, state) {
  document.getElementById('statusMsg').textContent = msg;
  document.getElementById('dot').className = 'dot' + (state ? ' ' + state : '');
}

function setContent(html) {
  document.getElementById('content').innerHTML = html;
}

function assetOf(o) {
  if (o.ASSETCODE && o.ASSETCODE.trim()) return o.ASSETCODE.trim();
  const m = (o.SECID || '').match(/^([A-Za-z]+)/);
  return m ? m[1] : 'OTHER';
}

function fmtDate(s) {
  if (!s) return '—';
  const [y, m, d] = s.split('-');
  const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  return `${+d} ${months[+m-1]} ${y}`;
}

function fmtN(v, dec = 0) {
  const n = Number(v);
  if (v === null || v === undefined || v === '' || isNaN(n) || n === 0)
    return '<span class="v0">—</span>';
  return n.toLocaleString('ru-RU', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}

function fmtPct(v) {
  const n = Number(v);
  if (v === null || v === undefined || v === '' || isNaN(n) || n === 0)
    return '<span class="v0">—</span>';
  return n.toFixed(1) + '%';
}

/* ─── fetch options for ONE asset, calls onPage after each page with matches ─── */

async function fetchAssetOptions(asset, onPage) {
  let secMap = {};
  let secCols, mdCols;
  let start = 0;
  let foundAny = false;
  let emptyStreak = 0;

  while (true) {
    const url = `${API}?iss.meta=off&q=${encodeURIComponent(asset)}&start=${start}`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const json = await resp.json();

    if (!secCols) {
      secCols = json.securities.columns;
      mdCols   = json.marketdata.columns;
    }

    const secRows = json.securities.data;
    if (!secRows.length) break;

    const mdMap = {};
    json.marketdata.data.forEach(r => {
      const o = {};
      mdCols.forEach((c, i) => o[c] = r[i]);
      mdMap[o.SECID] = o;
    });

    const today = new Date().toISOString().split('T')[0];
    let matched = 0;
    secRows.forEach(r => {
      const sec = {};
      secCols.forEach((c, i) => sec[c] = r[i]);
      if (assetOf(sec) === asset && (!sec.EXPIRATIONDATE || sec.EXPIRATIONDATE >= today)) {
        secMap[sec.SECID] = { ...sec, ...(mdMap[sec.SECID] || {}) };
        matched++;
        foundAny = true;
      }
    });

    // After each page that has matches — update UI immediately
    if (matched > 0 && onPage) onPage(Object.values(secMap), false);

    if (matched === 0) {
      if (foundAny) emptyStreak++;
      if (emptyStreak >= 2) break;
    } else {
      emptyStreak = 0;
    }

    if (secRows.length < 100) break;
    start += 100;
    if (start > 200000) break;
  }

  const result = Object.values(secMap);
  if (onPage) onPage(result, true); // final call
  return result;
}

/* ─── UI flow ─── */

async function selectAsset(asset) {
  if (!asset) return;
  currentAsset = asset;

  // highlight active preset
  document.querySelectorAll('.preset-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === asset);
  });

  document.getElementById('selExpiry').disabled = true;
  document.getElementById('btnRefresh').disabled = true;
  setStatus(`Загрузка ${asset}…`, 'spin');
  setContent(`<div class="state"><div class="spinner"></div><div class="state-txt">Загрузка опционов ${asset}…</div></div>`);

  let firstRender = true;

  function handlePage(options, done) {
    // Update expiry selector
    const expiries = [...new Set(options.map(o => o.EXPIRATIONDATE).filter(Boolean))].sort();
    const sel = document.getElementById('selExpiry');
    const prev = sel.value;
    sel.innerHTML = expiries.map(d => `<option value="${d}">${fmtDate(d)}</option>`).join('');
    // Restore previous selection if still available, else keep first
    if (prev && expiries.includes(prev)) sel.value = prev;
    sel.disabled = false;
    document.getElementById('btnRefresh').disabled = false;

    // Cache by expiry
    expiries.forEach(exp => {
      cache[`${asset}|${exp}`] = options.filter(o => o.EXPIRATIONDATE === exp);
    });

    const expiry = sel.value;
    const count = options.length;
    const label = done ? `${asset} — ${count} опционов` : `${asset} — загрузка… (${count})`;
    setStatus(label, done ? 'ok' : 'spin');

    // Render table on first page and on done
    if (firstRender || done) {
      firstRender = false;
      if (expiry) renderTable(cache[`${asset}|${expiry}`] || []);
    }
  }

  try {
    await fetchAssetOptions(asset, handlePage);
  } catch(e) {
    setStatus('Ошибка', 'err');
    setContent(`<div class="state"><div class="state-err">Ошибка: ${e.message}</div></div>`);
  }
}

function onExpiryChange() {
  const expiry = document.getElementById('selExpiry').value;
  if (!currentAsset || !expiry) return;

  const key = `${currentAsset}|${expiry}`;
  const data = cache[key];
  if (data) {
    setStatus(`${currentAsset} / ${fmtDate(expiry)} — ${data.length} опционов`, 'ok');
    renderTable(data);
  }
}

async function reloadCurrent() {
  if (!currentAsset) return;
  // Clear cache for current asset
  Object.keys(cache).forEach(k => { if (k.startsWith(currentAsset + '|')) delete cache[k]; });
  await selectAsset(currentAsset);
}

/* ─── table ─── */

function renderTable(slice) {
  if (!slice.length) {
    setContent('<div class="state"><div class="state-txt">Нет данных</div></div>');
    return;
  }

  const calls = {}, puts = {};
  const strikesSet = new Set();

  slice.forEach(o => {
    const strike = Number(o.STRIKE);
    if (!strike) return;
    strikesSet.add(strike);
    const t = (o.OPTIONTYPE || '').toUpperCase();
    if (t === 'C') calls[strike] = o;
    else if (t === 'P') puts[strike] = o;
  });

  if (!strikesSet.size) {
    setContent('<div class="state"><div class="state-txt">Нет страйков</div></div>');
    return;
  }

  const strikes = [...strikesSet].sort((a, b) => b - a);
  const mid = (strikes[0] + strikes[strikes.length - 1]) / 2;
  const atmStrike = strikes.reduce((best, s) =>
    Math.abs(s - mid) < Math.abs(best - mid) ? s : best, strikes[0]);

  let rows = '';
  strikes.forEach(strike => {
    const c = calls[strike] || {};
    const p = puts[strike] || {};
    const cls = strike === atmStrike ? ' class="atm"' : '';

    rows += `<tr${cls}>
      <td class="cc voi">${fmtN(c.OPENPOSITION)}</td>
      <td class="cc viv">${fmtPct(c.VOLATILITY)}</td>
      <td class="cc vth">${fmtN(c.THEORPRICE, 0)}</td>
      <td class="cc vb" >${fmtN(c.BID,        0)}</td>
      <td class="cc va" >${fmtN(c.OFFER,      0)}</td>
      <td class="sc">${strike.toLocaleString('ru-RU')}</td>
      <td class="pc vb" >${fmtN(p.BID,        0)}</td>
      <td class="pc va" >${fmtN(p.OFFER,      0)}</td>
      <td class="pc vth">${fmtN(p.THEORPRICE, 0)}</td>
      <td class="pc viv">${fmtPct(p.VOLATILITY)}</td>
      <td class="pc voi">${fmtN(p.OPENPOSITION)}</td>
    </tr>`;
  });

  setContent(`
    <table>
      <thead>
        <tr class="gh">
          <th colspan="5" class="ch">● CALL — Опционы колл</th>
          <th class="sh">СТРАЙК</th>
          <th colspan="5" class="ph">● PUT — Опционы пут</th>
        </tr>
        <tr class="colh">
          <th class="cc">OI</th><th class="cc">IV%</th><th class="cc">Теор.</th>
          <th class="cc">Bid</th><th class="cc">Ask</th>
          <th class="sc">—</th>
          <th class="pc">Bid</th><th class="pc">Ask</th><th class="pc">Теор.</th>
          <th class="pc">IV%</th><th class="pc">OI</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`);

  setTimeout(() => {
    const atm = document.querySelector('tr.atm');
    if (atm) atm.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }, 60);
}
</script>
</body>
</html>
