<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOEX — Доска опционов</title>
  <style>
    :root {
      --bg:       #0b0b14;
      --surface:  #121220;
      --card:     #191928;
      --border:   #232338;
      --text:     #cdd0e0;
      --muted:    #52526e;
      --accent:   #5b9cf6;
      --call:     #3ec79e;
      --put:      #e05555;
      --call-bg:  rgba(62,199,158,.07);
      --put-bg:   rgba(224,85,85,.07);
      --atm:      rgba(91,156,246,.35);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12px;
    }

    body { display: flex; flex-direction: column; }

    /* ─── HEADER ─── */
    .hdr {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 9px 18px;
      display: flex;
      align-items: center;
      gap: 18px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .logo {
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 3px;
      white-space: nowrap;
    }
    .logo small { color: var(--muted); font-weight: 400; letter-spacing: 0; font-size: 11px; }

    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    .ctrl {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .ctrl-lbl {
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .8px;
    }

    select, button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 5px 9px;
      border-radius: 3px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    select:focus, button:focus { outline: none; border-color: var(--accent); }
    button:hover { background: var(--border); }
    button:disabled { opacity: .5; cursor: default; }

    .status-bar {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .dot.ok   { background: #4ade80; animation: blink 3s infinite; }
    .dot.err  { background: var(--put); }
    .dot.spin { background: var(--accent); animation: blink .7s infinite; }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

    /* ─── CONTENT AREA ─── */
    .content { flex: 1; overflow: auto; position: relative; }

    /* ─── CENTER STATES ─── */
    .state {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px;
    }

    .spinner {
      width: 34px; height: 34px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .state-txt  { color: var(--muted); }
    .state-sub  { color: var(--accent); font-size: 11px; }
    .state-err  { color: var(--put); }

    /* ─── TABLE ─── */
    table { width: 100%; border-collapse: collapse; min-width: 860px; }

    thead { position: sticky; top: 0; z-index: 5; }

    /* group header row */
    .gh th {
      padding: 5px 10px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
    }
    .gh .ch { background: rgba(62,199,158,.18); color: var(--call); }
    .gh .ph { background: rgba(224,85,85,.18);  color: var(--put); }
    .gh .sh { background: var(--card); color: var(--accent); }

    /* column header row */
    .colh th {
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: .5px;
      border-bottom: 1px solid var(--border);
      text-align: right;
    }
    .colh .cc { background: rgba(62,199,158,.09); color: var(--call); }
    .colh .pc { background: rgba(224,85,85,.09);  color: var(--put); }
    .colh .sc { background: var(--card); color: var(--accent); text-align: center; }

    /* data rows */
    tbody tr { border-bottom: 1px solid rgba(255,255,255,.02); }
    tbody tr:hover td { filter: brightness(1.7); }

    td {
      padding: 3px 8px;
      text-align: right;
      white-space: nowrap;
    }

    td.cc { background: var(--call-bg); }
    td.pc { background: var(--put-bg); }
    td.sc {
      background: var(--card);
      color: var(--accent);
      font-weight: 700;
      text-align: center;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    /* ATM row */
    tr.atm td            { border-top: 1px solid var(--atm) !important;
                           border-bottom: 1px solid var(--atm) !important; }
    tr.atm td.sc         { background: rgba(91,156,246,.12); }

    /* value colours */
    .vb  { color: #4ade80; } /* bid  */
    .va  { color: #f87171; } /* ask  */
    .viv { color: #fb923c; } /* IV   */
    .vth { color: #94a3b8; } /* теор */
    .voi { color: var(--muted); } /* OI  */
    .v0  { color: var(--border); } /* empty */

    /* ─── FOOTER ─── */
    .ftr {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 5px 18px;
      display: flex; gap: 18px; flex-wrap: wrap;
      flex-shrink: 0;
    }
    .leg {
      display: flex; align-items: center; gap: 4px;
      font-size: 10px; color: var(--muted);
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="logo">MOEX <small>/ Options Chain</small></div>

  <div class="controls">
    <div class="ctrl">
      <span class="ctrl-lbl">Актив</span>
      <select id="selAsset" onchange="onAssetChange()">
        <option>Загрузка…</option>
      </select>
    </div>
    <div class="ctrl">
      <span class="ctrl-lbl">Экспирация</span>
      <select id="selExpiry" onchange="renderTable()">
        <option>—</option>
      </select>
    </div>
    <button id="btnRefresh" onclick="loadAll()">↻ Обновить</button>
  </div>

  <div class="status-bar">
    <div class="dot spin" id="dot"></div>
    <span id="statusMsg">Инициализация…</span>
  </div>
</div>

<!-- CONTENT -->
<div class="content" id="content">
  <div class="state">
    <div class="spinner"></div>
    <div class="state-txt">Подключение к MOEX ISS…</div>
  </div>
</div>

<!-- FOOTER / LEGEND -->
<div class="ftr">
  <div class="leg"><span class="vb">■</span> Bid — лучший покупатель</div>
  <div class="leg"><span class="va">■</span> Ask — лучший продавец</div>
  <div class="leg"><span class="viv">■</span> IV% — подразум. волатильность</div>
  <div class="leg"><span class="vth">■</span> Теор. — теоретическая цена</div>
  <div class="leg"><span class="voi">■</span> OI — открытые позиции</div>
  <div class="leg"><span style="color:var(--accent)">▬</span> ATM — страйк ближе всего к деньгам</div>
</div>

<script>
const API = 'https://iss.moex.com/iss/engines/futures/markets/options/securities.json';

let cache = [];   // all loaded options

/* ─── helpers ──────────────────────────────────────────────── */

function setStatus(msg, state) {
  document.getElementById('statusMsg').textContent = msg;
  document.getElementById('dot').className = 'dot' + (state ? ' ' + state : '');
}

function setContent(html) {
  document.getElementById('content').innerHTML = html;
}

function assetOf(o) {
  if (o.ASSETCODE && o.ASSETCODE.trim()) return o.ASSETCODE.trim();
  const m = (o.SHORTNAME || o.SECID || '').match(/^([A-Za-zА-Яа-яЁё0-9]+)/u);
  return m ? m[1] : 'OTHER';
}

function fmtDate(s) {
  if (!s) return '—';
  const [y, m, d] = s.split('-');
  const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  return `${+d} ${months[+m-1]} ${y}`;
}

function fmtN(v, dec = 0) {
  const n = Number(v);
  if (v === null || v === undefined || v === '' || isNaN(n) || n === 0)
    return '<span class="v0">—</span>';
  return n.toLocaleString('ru-RU', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}

function fmtPct(v) {
  const n = Number(v);
  if (v === null || v === undefined || v === '' || isNaN(n) || n === 0)
    return '<span class="v0">—</span>';
  return n.toFixed(1) + '%';
}

/* ─── fetch (with pagination) ──────────────────────────────── */

async function loadAll() {
  const btn = document.getElementById('btnRefresh');
  btn.disabled = true;
  setStatus('Загрузка…', 'spin');

  setContent(`
    <div class="state">
      <div class="spinner"></div>
      <div class="state-txt">Загрузка опционов с MOEX ISS…</div>
      <div class="state-sub" id="prog"></div>
    </div>`);

  try {
    cache = await fetchAll();
    setStatus(`Опционов: ${cache.length}`, 'ok');
    buildAssetSel();
  } catch (e) {
    setStatus('Ошибка', 'err');
    setContent(`
      <div class="state">
        <div class="state-err">Ошибка: ${e.message}</div>
        <div class="state-txt" style="font-size:11px">
          Проверьте соединение и нажмите «↻ Обновить»
        </div>
      </div>`);
  }

  btn.disabled = false;
}

async function fetchAll() {
  let map = {};
  let secCols, mdCols;
  let start = 0, page = 0;

  while (true) {
    page++;
    const prog = document.getElementById('prog');
    if (prog) prog.textContent = `Страница ${page} (записей: ${start})…`;

    const r = await fetch(`${API}?iss.meta=off&start=${start}`);
    if (!r.ok) throw new Error(`HTTP ${r.status} ${r.statusText}`);
    const json = await r.json();

    if (!secCols) {
      secCols = json.securities.columns;
      mdCols   = json.marketdata.columns;
    }

    const rows = json.securities.data;
    if (!rows.length) break;

    rows.forEach(r => {
      const o = {};
      secCols.forEach((c, i) => o[c] = r[i]);
      map[o.SECID] = o;
    });

    json.marketdata.data.forEach(r => {
      const m = {};
      mdCols.forEach((c, i) => m[c] = r[i]);
      if (map[m.SECID]) Object.assign(map[m.SECID], m);
    });

    if (rows.length < 100) break;
    start += 100;
    if (start > 200000) break;   // safety cap
  }

  return Object.values(map);
}

/* ─── selectors ────────────────────────────────────────────── */

function buildAssetSel() {
  const assets = [...new Set(cache.map(assetOf))].sort();
  const sel = document.getElementById('selAsset');
  sel.innerHTML = assets.map(a => `<option value="${a}">${a}</option>`).join('');
  onAssetChange();
}

function onAssetChange() {
  const asset = document.getElementById('selAsset').value;

  const dates = [...new Set(
    cache
      .filter(o => assetOf(o) === asset && o.EXPIRATIONDATE)
      .map(o => o.EXPIRATIONDATE)
  )].sort();

  const sel = document.getElementById('selExpiry');
  sel.innerHTML = dates.map(d =>
    `<option value="${d}">${fmtDate(d)}</option>`
  ).join('');

  renderTable();
}

/* ─── table ─────────────────────────────────────────────────── */

function renderTable() {
  const asset  = document.getElementById('selAsset').value;
  const expiry = document.getElementById('selExpiry').value;
  if (!asset || !expiry) return;

  const slice = cache.filter(o => assetOf(o) === asset && o.EXPIRATIONDATE === expiry);

  if (!slice.length) {
    setContent('<div class="state"><div class="state-txt">Нет данных для выбранных параметров</div></div>');
    return;
  }

  const calls = {}, puts = {};
  const strikesSet = new Set();

  slice.forEach(o => {
    const strike = Number(o.STRIKE);
    if (!strike) return;
    strikesSet.add(strike);
    const t = (o.OPTIONTYPE || '').toUpperCase();
    if (t === 'C') calls[strike] = o;
    else if (t === 'P') puts[strike] = o;
  });

  if (!strikesSet.size) {
    setContent('<div class="state"><div class="state-txt">Нет страйков в данных</div></div>');
    return;
  }

  // high → low (стандарт для опционных досок)
  const strikes = [...strikesSet].sort((a, b) => b - a);

  // ATM — ближайший к среднему между min и max
  const midPrice = (strikes[0] + strikes[strikes.length - 1]) / 2;
  const atmStrike = strikes.reduce((best, s) =>
    Math.abs(s - midPrice) < Math.abs(best - midPrice) ? s : best
  , strikes[0]);

  let rows = '';
  strikes.forEach(strike => {
    const c = calls[strike] || {};
    const p = puts[strike] || {};
    const cls = strike === atmStrike ? ' class="atm"' : '';

    rows += `<tr${cls}>
      <td class="cc voi">${fmtN(c.OPENPOSITION)}</td>
      <td class="cc viv">${fmtPct(c.VOLATILITY)}</td>
      <td class="cc vth">${fmtN(c.THEORPRICE, 0)}</td>
      <td class="cc vb" >${fmtN(c.BID,       0)}</td>
      <td class="cc va" >${fmtN(c.OFFER,     0)}</td>
      <td class="sc">${strike.toLocaleString('ru-RU')}</td>
      <td class="pc vb" >${fmtN(p.BID,       0)}</td>
      <td class="pc va" >${fmtN(p.OFFER,     0)}</td>
      <td class="pc vth">${fmtN(p.THEORPRICE, 0)}</td>
      <td class="pc viv">${fmtPct(p.VOLATILITY)}</td>
      <td class="pc voi">${fmtN(p.OPENPOSITION)}</td>
    </tr>`;
  });

  setContent(`
    <table>
      <thead>
        <tr class="gh">
          <th colspan="5" class="ch">● CALL — Опционы колл</th>
          <th class="sh">СТРАЙК</th>
          <th colspan="5" class="ph">● PUT — Опционы пут</th>
        </tr>
        <tr class="colh">
          <th class="cc">OI</th>
          <th class="cc">IV%</th>
          <th class="cc">Теор.</th>
          <th class="cc">Bid</th>
          <th class="cc">Ask</th>
          <th class="sc">—</th>
          <th class="pc">Bid</th>
          <th class="pc">Ask</th>
          <th class="pc">Теор.</th>
          <th class="pc">IV%</th>
          <th class="pc">OI</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`);

  // прокрутка к ATM-строке
  setTimeout(() => {
    const atm = document.querySelector('tr.atm');
    if (atm) atm.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }, 60);
}

/* ─── init ─────────────────────────────────────────────────── */
loadAll();
</script>
</body>
</html>
